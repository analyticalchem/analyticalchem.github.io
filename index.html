<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>analyticalchem Projects</title>
  <meta name="description" content="Interactive chemistry teaching tools and other projects by analyticalchem.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='13' width='8' height='6' rx='1' fill='%231baf7a'/%3E%3Crect x='12' y='13' width='8' height='6' rx='1' fill='%23eb6834'/%3E%3Crect x='22' y='13' width='8' height='6' rx='1' fill='%232a78d6'/%3E%3C/svg%3E">
  <style>
    /* ---------- Tokens (shared with Van Deemter Explorer) ---------- */

    :root {
      color-scheme: light;
      --page: #f9f9f7;
      --surface: #fcfcfb;
      --surface-2: #f3f2ee;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #6f6d68;
      --grid: #e1e0d9;
      --axis: #c3c2b7;
      --border: rgba(11, 11, 11, 0.10);
      --accent: #2a78d6;
      --accent-ink: #ffffff;
      --series-a: #1baf7a;
      --series-b: #eb6834;
      --series-c: #2a78d6;
      --piano-white: #ffffff;
      --piano-black: #2b2a28;
      --radius: 12px;
      --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --page: #0d0d0d;
        --surface: #1a1a19;
        --surface-2: #232321;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted: #9a988f;
        --grid: #2c2c2a;
        --axis: #45443f;
        --border: rgba(255, 255, 255, 0.10);
        --accent: #3987e5;
        --series-a: #199e70;
        --series-b: #d95926;
        --series-c: #3987e5;
        --piano-white: #4a4944;
        --piano-black: #0d0d0d;
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #232321;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #9a988f;
      --grid: #2c2c2a;
      --axis: #45443f;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
      --series-a: #199e70;
      --series-b: #d95926;
      --series-c: #3987e5;
      --piano-white: #4a4944;
      --piano-black: #0d0d0d;
    }

    /* ---------- Base ---------- */

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--text-primary);
      font: 15px/1.5 var(--font);
    }

    h1, h2, h3 { line-height: 1.2; margin: 0; }
    h1 { font-size: 2.6rem; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; }
    h2 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.005em; }
    h3 { font-size: 1.2rem; font-weight: 650; }

    .site-header, main, .site-footer {
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    .site-header { padding-top: 28px; padding-bottom: 28px; }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .title-rule { display: flex; gap: 4px; width: 260px; max-width: 100%; margin-top: 12px; }
    .title-rule span { flex: 1; height: 5px; border-radius: 1px; background: var(--series-a); }
    .title-rule span:nth-child(2) { background: var(--series-b); }
    .title-rule span:nth-child(3) { background: var(--series-c); }

    .lede { margin: 12px 0 0; color: var(--text-secondary); max-width: 62ch; }

    main { display: grid; gap: 32px; }

    .group h2 { margin-bottom: 14px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* ---------- Buttons ---------- */

    .btn {
      display: inline-block;
      padding: 7px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text-primary);
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(0.97); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    .btn.ghost { background: transparent; font-weight: 500; font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; }

    .btn:focus-visible, .card h3 a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Project cards ---------- */

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 18px 20px 20px;
      background: var(--surface);
      border: 2px solid var(--text-muted);
      border-radius: var(--radius);
      transition: border-color 0.15s, transform 0.15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .card .eyebrow { margin-bottom: 4px; font-size: 0.72rem; }

    .card h3 a { color: inherit; text-decoration: none; }
    /* Stretch the title link over the whole card, so any click opens the project. */
    .card h3 a::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); }

    .card p.desc { flex: 1; margin: 8px 0 18px; color: var(--text-secondary); font-size: 0.92rem; }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--grid);
    }
    /* Keeps the Source link clickable above the stretched title link. */
    .card-actions a { position: relative; z-index: 1; }

    /* ---------- Card graphics ---------- */

    .art {
      margin-bottom: 16px;
      padding: 8px;
      background: var(--page);
      border: 1px solid var(--grid);
      border-radius: 8px;
    }
    .art svg { display: block; width: 100%; height: auto; }

    .art .axis { fill: none; stroke: var(--axis); stroke-width: 1.5; }
    .art .neutral { stroke: var(--grid); stroke-width: 1.2; stroke-dasharray: 3 3; }
    .art .guide { stroke: var(--text-muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .art .label { fill: var(--text-muted); font: 600 10px var(--font); }
    .art .formula { fill: var(--text-primary); font: 700 11px var(--font); }
    .art .curve { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .art .curve.thin { stroke-width: 2.2; }
    .art .a { stroke: var(--series-a); }
    .art .b { stroke: var(--series-b); }
    .art .c { stroke: var(--series-c); }
    .art .ta { fill: var(--series-a); }
    .art .tb { fill: var(--series-b); }
    .art .tc { fill: var(--series-c); }
    .art .total { stroke: var(--text-primary); }
    .art .buffer { fill: var(--series-a); opacity: 0.1; }
    .art .dot { fill: var(--text-primary); stroke: var(--page); stroke-width: 2; }
    .art .ring { fill: var(--page); stroke: var(--text-primary); stroke-width: 2; }

    .art .wkey { fill: var(--piano-white); stroke: var(--axis); stroke-width: 1.2; }
    .art .wkey.on { fill: color-mix(in srgb, var(--series-c) 30%, var(--piano-white)); }
    .art .bkey { fill: var(--piano-black); }
    .art .pill { fill: var(--surface); stroke: var(--axis); stroke-width: 1.2; }
    .art .pill.on { fill: var(--series-c); stroke: none; }
    .art .pill-text { fill: var(--text-secondary); font: 700 11px var(--font); text-anchor: middle; dominant-baseline: central; }
    .art .pill-text.on { fill: #ffffff; }
    .art .arrow { fill: none; stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Footer ---------- */

    .site-footer { padding-top: 36px; padding-bottom: 32px; font-size: 0.8rem; color: var(--text-muted); }
    .site-footer a { color: var(--text-secondary); }

    /* ---------- Responsive ---------- */

    @media (max-width: 560px) {
      .site-header, main, .site-footer { padding-left: 16px; padding-right: 16px; }
      h1 { font-size: 2rem; }
      .title-rule { width: 200px; }
      .card { padding: 14px 14px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
    }
  </style>
  <script>
    // Apply a saved theme before the page draws, so it doesn't flash.
    try {
      var saved = localStorage.getItem('links-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) { /* storage unavailable */ }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="title-row">
      <div>
        <p class="eyebrow">analyticalchem · Interactive</p>
        <h1>Projects</h1>
        <div class="title-rule" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="lede">Interactive teaching tools for analytical chemistry, plus a few other projects.</p>
      </div>
      <button id="theme" class="btn ghost" type="button" title="Switch between automatic, light and dark colors">Theme: auto</button>
    </div>
  </header>

  <main id="groups"></main>

  <footer class="site-footer">
    <p>analyticalchem · source for every project is on <a href="https://github.com/analyticalchem">GitHub</a>.</p>
  </footer>

  <script>
    // ── Edit this list to add, remove, or regroup links ──
    // Groups appear in the order they first show up here.
    // "topic" is the small line above each title.
    // "art" picks a graphic from the ART list further down (leave it out for none).
    var links = [
      {
        group: "Chemistry",
        art: "titration",
        topic: "Acid–Base Equilibria",
        title: "Weak Titration Explorer",
        url: "https://analyticalchem.github.io/weaktitration/",
        source: "https://github.com/analyticalchem/weaktitration",
        desc: "Drag along a titration curve to watch pH and species fractions change at each stage."
      },
      {
        group: "Chemistry",
        art: "vandeemter",
        topic: "Liquid Chromatography",
        title: "Van Deemter Explorer",
        url: "https://analyticalchem.github.io/van-deemter-explorer/",
        source: "https://github.com/analyticalchem/van-deemter-explorer",
        desc: "See how flow rate, temperature, particle size and mass transfer shape plate height in liquid chromatography."
      },
      {
        group: "Chemistry",
        art: "grating",
        topic: "Optical Spectroscopy",
        title: "Diffraction Grating Explorer",
        url: "https://analyticalchem.github.io/diffraction-grating-explorer/",
        source: "https://github.com/analyticalchem/diffraction-grating-explorer",
        desc: "See where laser and white-light orders leave a grating, and turn it like a monochromator to select wavelengths."
      },
      {
        group: "Other Projects",
        art: "piano",
        topic: "Music Theory",
        title: "Chord Progression Lab",
        url: "https://analyticalchem.github.io/chord-progression-lab/",
        source: "https://github.com/analyticalchem/chord-progression-lab",
        desc: "Build chord progressions in any key and hear them on piano, with harmonic function and the circle of fifths."
      }
    ];

    // ── Card graphics ──
    // Colours come from the page's CSS, so they follow the light/dark theme.
    var ART = {
      // Weak acid (Ka 1.8e-5) titrated with strong base: buffer region shaded,
      // ring at the half-equivalence point (pH = pKa), dot at the equivalence point.
      titration:
        '<svg viewBox="0 0 320 146">' +
          '<rect class="buffer" x="49" y="16" width="120" height="112"/>' +
          '<line class="neutral" x1="34" y1="74" x2="304" y2="74"/>' +
          '<path class="axis" d="M34 16V128H304"/>' +
          '<line class="guide" x1="184" y1="60.7" x2="184" y2="128"/>' +
          '<path class="curve a" d="M34,105.8 L37,103.4 L41.5,101 L49,98.7 L56.5,97.2 L64,96 L79,94.2 L94,92.8 L109,91.4 L124,90 L139,88.6 L154,86.8 L161.5,85.6 L169,84 L173.5,82.7 L178,80.7 L181,78.4 L182.5,76 L183.2,73.7 L184,60.7 L184.7,47.8 L185.5,45.5 L187,43.2 L190,40.9 L194.5,39.1 L199,37.9 L206.5,36.6 L214,35.7 L229,34.5 L244,33.7 L259,33.1 L274,32.6 L289,32.2"/>' +
          '<circle class="ring" cx="109" cy="91.4" r="4.5"/>' +
          '<circle class="dot" cx="184" cy="60.7" r="5"/>' +
          '<text class="label" x="28" y="24" text-anchor="end">pH</text>' +
          '<text class="label" x="28" y="77" text-anchor="end">7</text>' +
          '<text class="label" x="109" y="121" text-anchor="middle">buffer</text>' +
          '<text class="label" x="192" y="66">equivalence</text>' +
          '<text class="label" x="304" y="142" text-anchor="end">base added</text>' +
        '</svg>',

      // H = A + B/u + C·u with the three terms in the Van Deemter Explorer's colours
      // and a ring at the optimum velocity.
      vandeemter:
        '<svg viewBox="0 0 320 146">' +
          '<path class="axis" d="M34 16V128H304"/>' +
          '<line class="guide" x1="122" y1="78.2" x2="122" y2="128"/>' +
          '<line class="curve thin a" x1="51.6" y1="111.4" x2="298" y2="111.4"/>' +
          '<path class="curve thin b" d="M51.6,44.9 L53.8,54.2 L56,61.5 L60.4,72.6 L64.8,80.5 L69.2,86.5 L73.6,91.1 L78,94.8 L86.8,100.3 L95.6,104.3 L104.4,107.2 L113.2,109.5 L122,111.4 L135.2,113.6 L148.4,115.2 L166,116.9 L188,118.5 L210,119.7 L232,120.6 L254,121.4 L276,122 L298,122.5"/>' +
          '<line class="curve thin c" x1="34" y1="128" x2="298" y2="78.2"/>' +
          '<path class="curve total" d="M51.6,25 L53.8,33.8 L56,40.8 L60.4,51 L64.8,58.1 L69.2,63.2 L73.6,67 L78,69.8 L86.8,73.7 L95.6,76 L104.4,77.3 L113.2,78 L122,78.2 L135.2,77.8 L148.4,77 L166,75.4 L188,72.8 L210,69.8 L232,66.6 L254,63.2 L276,59.7 L298,56"/>' +
          '<circle class="ring" cx="122" cy="78.2" r="4.5"/>' +
          '<text class="formula" x="304" y="26" text-anchor="end">H = <tspan class="ta">A</tspan> + <tspan class="tb">B/u</tspan> + <tspan class="tc">C·u</tspan></text>' +
          '<text class="label" x="28" y="24" text-anchor="end">H</text>' +
          '<text class="label" x="304" y="142" text-anchor="end">u</text>' +
        '</svg>',

      // Reflection grating (1200 /mm) with a beam arriving at θ = 40°: the 0th order mirrors it,
      // and the 1st order splits blue, green and red at −6.3°, −0.2° and +6.7° from the normal.
      grating: (function () {
        var s = '<svg viewBox="0 0 320 146">';
        s += '<path class="axis" d="';
        for (var x = 60; x <= 266; x += 8) s += 'M' + x + ' 127l-6 7';
        s += '"/>';
        s += '<line class="curve total" x1="50" y1="124" x2="270" y2="124"/>';
        s += '<line class="curve thin total" x1="95.7" y1="47.4" x2="160" y2="124"/>';
        s += '<path class="arrow" d="M121.5 85.8L131.8 90.3L129.1 79.4"/>';
        s += '<line class="curve thin total" x1="160" y1="124" x2="224.3" y2="47.4"/>';
        s += '<line class="curve thin c" x1="160" y1="124" x2="171" y2="24.6"/>';
        s += '<line class="curve thin a" x1="160" y1="124" x2="160.3" y2="24"/>';
        s += '<line class="curve thin b" x1="160" y1="124" x2="148.3" y2="24.7"/>';
        s += '<text class="formula" x="304" y="16" text-anchor="end">mλ = d(sin θ + sin φ)</text>';
        s += '<text class="label" x="89" y="50" text-anchor="end">incident</text>';
        s += '<text class="label" x="231" y="50">0th order</text>';
        s += '<text class="label" x="143" y="27" text-anchor="end">1st order</text>';
        s += '<text class="label" x="270" y="144" text-anchor="end">grating</text>';
        return s + '</svg>';
      })(),

      // Two octaves of keys with the I chord (C–E–G) lit, under an I–IV–V–I progression.
      piano: (function () {
        var s = '<svg viewBox="0 0 320 146">';
        var chords = ['I', 'IV', 'V', 'I'];
        chords.forEach(function (name, i) {
          var x = 42 + i * 64, on = i === 0 ? ' on' : '';
          s += '<rect class="pill' + on + '" x="' + x + '" y="6" width="44" height="22" rx="11"/>';
          s += '<text class="pill-text' + on + '" x="' + (x + 22) + '" y="17">' + name + '</text>';
          if (i < chords.length - 1) {
            var ax = x + 48;
            s += '<path class="arrow" d="M' + ax + ' 17H' + (ax + 11) + 'M' + (ax + 7) + ' 13L' + (ax + 11) + ' 17L' + (ax + 7) + ' 21"/>';
          }
        });
        var lit = [0, 2, 4];                       // C, E, G
        for (var i = 0; i < 14; i++) {
          var on = lit.indexOf(i) !== -1 ? ' on' : '';
          s += '<rect class="wkey' + on + '" x="' + (20 + i * 20) + '" y="40" width="20" height="100" rx="3"/>';
        }
        [0, 1, 3, 4, 5, 7, 8, 10, 11, 12].forEach(function (i) {
          s += '<rect class="bkey" x="' + (34 + i * 20) + '" y="40" width="12" height="60" rx="2"/>';
        });
        lit.forEach(function (i) {
          s += '<circle class="tc" cx="' + (30 + i * 20) + '" cy="126" r="4.5"/>';
        });
        return s + '</svg>';
      })()
    };

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    var groups = new Map();
    links.forEach(function (link) {
      if (!groups.has(link.group)) groups.set(link.group, []);
      groups.get(link.group).push(link);
    });

    var main = document.getElementById('groups');
    groups.forEach(function (items, name) {
      var section = el('section', 'group');
      section.append(el('h2', '', name));
      var grid = el('div', 'grid');

      items.forEach(function (item) {
        var card = el('article', 'card');

        var h3 = el('h3');
        var a = el('a', '', item.title);
        a.href = item.url;
        h3.append(a);

        var actions = el('div', 'card-actions');
        var open = el('span', 'btn primary', 'Open');
        open.setAttribute('aria-hidden', 'true');
        actions.append(open);
        if (item.source) {
          var src = el('a', 'btn ghost', 'Source');
          src.href = item.source;
          src.setAttribute('aria-label', item.title + ' source code on GitHub');
          actions.append(src);
        }

        if (item.art && ART[item.art]) {
          var art = el('div', 'art');
          art.setAttribute('aria-hidden', 'true');
          art.innerHTML = ART[item.art];
          card.append(art);
        }
        if (item.topic) card.append(el('p', 'eyebrow', item.topic));
        card.append(h3, el('p', 'desc', item.desc), actions);
        grid.append(card);
      });

      section.append(grid);
      main.append(section);
    });

    // Theme button: auto → light → dark, same as Van Deemter Explorer.
    var themes = ['auto', 'light', 'dark'];
    var themeBtn = document.getElementById('theme');
    function applyTheme(name) {
      if (name === 'auto') delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = name;
      themeBtn.textContent = 'Theme: ' + name;
      try { localStorage.setItem('links-theme', name); } catch (e) { /* storage unavailable */ }
    }
    themeBtn.textContent = 'Theme: ' + (document.documentElement.dataset.theme || 'auto');
    themeBtn.addEventListener('click', function () {
      var cur = document.documentElement.dataset.theme || 'auto';
      applyTheme(themes[(themes.indexOf(cur) + 1) % themes.length]);
    });
  </script>
</body>
</html>
