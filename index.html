<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>analyticalchem Projects</title>
  <meta name="description" content="Interactive chemistry tools and other projects by analyticalchem.">
  <style>
    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #5f5f66;
      --border: #e3e1dc;
      --accent: #0f6e8c;
      --accent-soft: #e3f1f5;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416;
        --surface: #1d1d20;
        --text: #ececee;
        --muted: #a2a2aa;
        --border: #2e2e33;
        --accent: #5cc3e0;
        --accent-soft: #1b3038;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 56px 16px 40px;
    }

    header { margin-bottom: 40px; }
    header p.handle {
      margin: 0 0 4px;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.9rem, 5vw, 2.5rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    section { margin-bottom: 40px; }
    section h2 {
      margin: 0 0 14px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      transition: border-color 0.15s, transform 0.15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

    .card h3 { margin: 0 0 6px; font-size: 1.1rem; }
    .card h3 a { color: var(--text); text-decoration: none; }
    .card h3 a:focus { outline: none; }
    /* Makes the whole card clickable without nesting links */
    .card h3 a::after { content: ""; position: absolute; inset: 0; border-radius: 12px; }

    .card p { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; flex: 1; }

    .card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }
    .card .open {
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .card .source {
      position: relative;
      z-index: 1;
      color: var(--muted);
    }
    .card .source:hover { color: var(--accent); }

    footer {
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }
    footer a { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="handle">analyticalchem</p>
      <h1>Projects</h1>
    </header>

    <div id="groups"></div>

    <footer>
      More on <a href="https://github.com/analyticalchem">GitHub</a>
    </footer>
  </main>

  <script>
    // ── Edit this list to add, remove, or regroup links ──
    // Groups appear in the order they first show up here.
    const links = [
      {
        group: "Chemistry",
        title: "Weak Titration Explorer",
        url: "https://analyticalchem.github.io/weaktitration/",
        source: "https://github.com/analyticalchem/weaktitration",
        desc: "Drag along a titration curve to watch pH and species fractions change at each stage."
      },
      {
        group: "Chemistry",
        title: "Van Deemter Explorer",
        url: "https://analyticalchem.github.io/van-deemter-explorer/",
        source: "https://github.com/analyticalchem/van-deemter-explorer",
        desc: "See how flow rate, temperature, particle size and mass transfer shape plate height in liquid chromatography."
      },
      {
        group: "Other Projects",
        title: "Chord Progression Lab",
        url: "https://analyticalchem.github.io/chord-progression-lab/",
        source: "https://github.com/analyticalchem/chord-progression-lab",
        desc: "Build chord progressions in any key and hear them on piano, with harmonic function and the circle of fifths."
      }
    ];

    const container = document.getElementById("groups");
    const groups = new Map();
    for (const link of links) {
      if (!groups.has(link.group)) groups.set(link.group, []);
      groups.get(link.group).push(link);
    }

    for (const [name, items] of groups) {
      const section = document.createElement("section");
      const heading = document.createElement("h2");
      heading.textContent = name;
      const grid = document.createElement("div");
      grid.className = "grid";

      for (const item of items) {
        const card = document.createElement("article");
        card.className = "card";

        const h3 = document.createElement("h3");
        const a = document.createElement("a");
        a.href = item.url;
        a.textContent = item.title;
        h3.append(a);

        const p = document.createElement("p");
        p.textContent = item.desc;

        const meta = document.createElement("div");
        meta.className = "meta";
        const open = document.createElement("span");
        open.className = "open";
        open.textContent = "Open →";
        open.setAttribute("aria-hidden", "true");
        meta.append(open);

        if (item.source) {
          const src = document.createElement("a");
          src.className = "source";
          src.href = item.source;
          src.textContent = "Source";
          src.setAttribute("aria-label", item.title + " source code");
          meta.append(src);
        }

        card.append(h3, p, meta);
        grid.append(card);
      }

      section.append(heading, grid);
      container.append(section);
    }
  </script>
</body>
</html>
